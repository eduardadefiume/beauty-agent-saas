name: Audit DEV G2 appointment deposit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify G2 deposit persistence in DEV
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hjghwryhphgusefyivbl
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Validate G2 deposit persistence through read-only Management API query
        run: node scripts/verify-g2-deposit-persistence.mjs
