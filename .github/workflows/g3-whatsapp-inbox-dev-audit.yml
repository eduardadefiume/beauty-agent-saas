name: Audit DEV G3 WhatsApp inbox and consent

on:
  push:
    branches:
      - feature/saas-com-dashboard-completo
    paths:
      - .github/workflows/g3-whatsapp-inbox-dev-audit.yml
      - scripts/verify-g3-whatsapp-inbox-consent.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g3-whatsapp-inbox-dev-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify G3 inbox and consent structure in DEV
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hjghwryhphgusefyivbl
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Audit G3 through a read-only Management API query
        run: node scripts/verify-g3-whatsapp-inbox-consent.mjs
